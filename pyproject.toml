[project]
name = "email-app"
version = "0.1.0"
description = "Self-hosted desktop email app (bulk send, templates, SMTP)."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "platformdirs>=4.3",
  "pywebview>=5.3",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "aiosmtplib>=3.0",
  "jinja2>=3.1",
  "cryptography>=43",
  "bleach>=6.2",
  "html2text>=2024.2.26",
  "python-multipart>=0.0.17",
  "email-validator>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosmtpd>=1.4",
  "ruff>=0.7",
]

[project.scripts]
email-app = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
